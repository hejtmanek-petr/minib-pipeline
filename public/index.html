<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MINIB Project Pipeline</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/icons/favicon-32x32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-application-capable" content="yes">
  <meta name="apple-mobile-web-application-title" content="MEA Pipeline">
  <meta name="theme-color" content="#f0b400">
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const user = data.user;
          const target = (user && App.getLastPage(user.id)) || App.defaultLandingPage(user && user.role);
          window.location.replace(target);
        } else {
          window.location.replace('/login.html');
        }
      } catch (e) {
        window.location.replace('/login.html');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
